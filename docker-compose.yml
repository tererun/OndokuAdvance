services:
  ondoku-advance:
    image: eclipse-temurin:21-jre
    container_name: ondoku-advance
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TZ=Asia/Tokyo
    command: java -jar OndokuAdvance-1.1.6-all.jar
    restart: unless-stopped
    # ホストのネットワークを使う（localhost対策）
    network_mode: host
    
    # ▼ ここが -it に相当する設定です
    stdin_open: true # -i (インタラクティブモード: 標準入力を開いたままにする)
    tty: true        # -t (擬似端末を割り当てる)
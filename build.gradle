plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

group 'run.tere.bot'
version = providers.gradleProperty('appVersion').get()

repositories {
    mavenCentral()
    maven {
        url 'https://m2.dv8tion.net/releases'
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.1'
    implementation group: 'net.dv8tion', name: 'JDA', version:'6.4.1'
    implementation 'club.minnced:jdave-api:0.1.8'
    implementation 'club.minnced:jdave-native-linux-x86-64:0.1.8'
    implementation 'club.minnced:jdave-native-linux-aarch64:0.1.8'
    implementation group: 'com.sedmelluq', name: 'lavaplayer', version: '1.3.77'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('shadowJar') {
    archiveFileName.set("${rootProject.name}-all.jar")
}

tasks.register('generateVersionProperties') {
    def outputDir = "$buildDir/generated/resources"
    inputs.property('appVersion', project.version.toString())
    outputs.dir outputDir

    doLast {
        file("$outputDir/version.properties").text = "version=${project.version}"
    }
}

processResources.dependsOn generateVersionProperties
processResources {
    from("$buildDir/generated/resources") {
        into '.'
    }
}

jar {
    manifest {
        attributes 'Main-Class': "run.tere.bot.Main"
    }
}
